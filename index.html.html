<style>
/* ════════════════════════════════════════════
   TOKENS
════════════════════════════════════════════ */
:root{
  --green:       #1a6b3a;
  --green-dark:  #124d2a;
  --green-mid:   #2d8a52;
  --green-light: #4aab6d;
  --green-pale:  #e8f5ed;
  --green-pale2: #d1ecda;
  --gold:        #c8972a;
  --gold-pale:   #fdf3e1;
  --navy:        #0f2240;
  --white:       #ffffff;
  --bg:          #f7f8fa;
  --bg2:         #eef1f5;
  --text:        #1a1f2e;
  --text-mid:    #4a5568;
  --text-light:  #7a8699;
  --border:      #dde3ed;
  --radius:      10px;
  --radius-lg:   16px;
  --shadow:      0 2px 12px rgba(15,34,64,.09);
  --shadow-lg:   0 6px 32px rgba(15,34,64,.14);
  --topbar-h:    40px;
  --announce-h:  32px;
  --nav-h:       70px;
  --font:        "Inter", sans-serif;
  --font-serif:  "Lora", serif;
}

/* ════════════════ DARK MODE TOKENS ════════════════ */
[data-theme="dark"]{
  --white:       #1a1f2e;
  --bg:          #111520;
  --bg2:         #1e2335;
  --text:        #e2e8f0;
  --text-mid:    #a0aec0;
  --text-light:  #718096;
  --border:      #2d3748;
  --shadow:      0 2px 12px rgba(0,0,0,.4);
  --shadow-lg:   0 6px 32px rgba(0,0,0,.5);
  --green-pale:  rgba(26,107,58,.2);
  --green-pale2: rgba(26,107,58,.3);
  --gold-pale:   rgba(200,151,42,.15);
  --navy:        #0a1628;
}
[data-theme="dark"] .navbar{background:#1a1f2e;border-bottom-color:var(--green-mid);}
[data-theme="dark"] .nav-brand-name{color:#e2e8f0;}
[data-theme="dark"] .content-section{background:#1e2335;}
[data-theme="dark"] .sb-card{background:#1e2335;}
[data-theme="dark"] .login-box{background:#1e2335;}
[data-theme="dark"] .admin-content{background:#1e2335;}
[data-theme="dark"] .admin-tabs{background:#1e2335;}
[data-theme="dark"] .save-bar{background:#1e2335;border-top-color:#2d3748;}
[data-theme="dark"] .af-input{background:#111520;border-color:#2d3748;color:#e2e8f0;}
[data-theme="dark"] .login-input{background:#111520;border-color:#2d3748;color:#e2e8f0;}
[data-theme="dark"] .nav-drop{background:#1e2335;border-color:#2d3748;}
[data-theme="dark"] .nav-mobile{background:#1a1f2e;border-top-color:#2d3748;}
[data-theme="dark"] .mob-row{border-bottom-color:#2d3748;color:#e2e8f0;}
[data-theme="dark"] .news-card{border-bottom-color:#2d3748;}
[data-theme="dark"] .news-card:hover{background:rgba(26,107,58,.15);}
[data-theme="dark"] .kontak-grid{border-color:#2d3748;}
[data-theme="dark"] .kontak-row{border-bottom-color:#2d3748;}
[data-theme="dark"] .sb-agenda-item{border-bottom-color:#2d3748;}
[data-theme="dark"] .sb-news-item:hover{background:rgba(26,107,58,.15);}
[data-theme="dark"] .sb-stat-row{border-bottom-color:#2d3748;}
[data-theme="dark"] .af-card{border-color:#2d3748;}
[data-theme="dark"] .photo-up{background:#111520;border-color:#2d3748;}
[data-theme="dark"] .galeri-item{background:#1e2335;}
[data-theme="dark"] footer{background:#0a1020;}

/* ════════════════ DARK MODE TOGGLE ════════════════ */
.dm-toggle{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);cursor:pointer;transition:all .3s;border:none;font-size:15px;}
.dm-toggle:hover{background:var(--green-light);transform:rotate(20deg);}

/* ════════════════ LOADING SCREEN ════════════════ */
#page-loader{position:fixed;inset:0;background:var(--navy);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s ease;}
#page-loader.fade-out{opacity:0;pointer-events:none;}
.loader-logo-wrap{position:relative;}
.loader-ring{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--green-light);animation:spin 1s linear infinite;}
.loader-inner-ring{position:absolute;inset:8px;border-radius:50%;border:3px solid rgba(255,255,255,.05);border-bottom-color:var(--gold);animation:spin 1.5s linear infinite reverse;}
.loader-text{color:rgba(255,255,255,.8);font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;animation:pulse-loader 1.5s ease-in-out infinite;}
.loader-sub{color:rgba(255,255,255,.4);font-size:11px;letter-spacing:1px;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse-loader{0%,100%{opacity:.5}50%{opacity:1}}

/* ════════════════ ANIMATIONS ════════════════ */
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInLeft{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeInRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

.anim-fadeinup{animation:fadeInUp .6s ease both;}
.anim-fadeinleft{animation:fadeInLeft .6s ease both;}
.anim-fadeinright{animation:fadeInRight .6s ease both;}
.anim-scalein{animation:scaleIn .5s ease both;}
.anim-delay-1{animation-delay:.1s;}
.anim-delay-2{animation-delay:.2s;}
.anim-delay-3{animation-delay:.3s;}
.anim-delay-4{animation-delay:.4s;}
.anim-delay-5{animation-delay:.5s;}

/* Scroll-reveal: elements start hidden, JS adds .revealed */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease;}
.reveal.revealed{opacity:1;transform:translateY(0);}
.reveal-left{opacity:0;transform:translateX(-28px);transition:opacity .65s ease,transform .65s ease;}
.reveal-left.revealed{opacity:1;transform:translateX(0);}
.reveal-scale{opacity:0;transform:scale(.94);transition:opacity .65s ease,transform .65s ease;}
.reveal-scale.revealed{opacity:1;transform:scale(1);}

/* Card hover lift effect */
.card-lift{transition:transform .3s ease,box-shadow .3s ease;}
.card-lift:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(15,34,64,.18);}
[data-theme="dark"] .card-lift:hover{box-shadow:0 12px 40px rgba(0,0,0,.5);}

/* Button pulse */
.btn-pulse{animation:btnPulse 2s ease-in-out infinite;}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(74,171,109,.4)}50%{box-shadow:0 0 0 8px rgba(74,171,109,0)}}

/* Skeleton loading shimmer */
.skeleton{background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}

/* Page transition */
.page-transition{animation:fadeInUp .45s ease both;}


/* ════════════════ STATISTIK COUNTER ════════════════ */
.stats-section{background:var(--navy);padding:40px 24px;}
.stats-inner{max-width:1240px;margin:0 auto;}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-lg);padding:24px 16px;text-align:center;transition:transform .3s,background .3s;}
.stat-card:hover{background:rgba(255,255,255,.12);transform:translateY(-4px);}
.stat-number{font-size:clamp(28px,5vw,42px);font-weight:800;color:var(--green-light);line-height:1;}
.stat-label{font-size:13px;color:rgba(255,255,255,.7);margin-top:6px;font-weight:500;}
.stat-icon{font-size:24px;margin-bottom:8px;}

/* ════════════════ BANNER PPDB ════════════════ */
.ppdb-banner{background:linear-gradient(135deg,var(--green-dark) 0%,var(--green-mid) 100%);padding:16px 24px;}
.ppdb-banner-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.ppdb-banner-text{color:#fff;}
.ppdb-banner-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
.ppdb-banner-title{font-size:16px;font-weight:700;}
.ppdb-banner-btn{background:var(--gold);color:var(--navy);font-size:13px;font-weight:700;padding:9px 20px;border-radius:20px;white-space:nowrap;transition:background .2s;cursor:pointer;border:none;}
.ppdb-banner-btn:hover{background:#b08222;}

/* ════════════════ PROGRAM UNGGULAN ════════════════ */
.program-section{padding:48px 24px;background:var(--bg);}
.program-inner{max-width:1240px;margin:0 auto;}
.program-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px;}
@media(min-width:768px){.program-grid{grid-template-columns:repeat(4,1fr);}}
.program-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 16px;text-align:center;transition:all .3s;cursor:default;}
.program-card:hover{border-color:var(--green-light);box-shadow:0 8px 24px rgba(26,107,58,.15);transform:translateY(-3px);}
.program-icon{font-size:36px;margin-bottom:12px;}
.program-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:6px;}
.program-desc{font-size:12px;color:var(--text-light);line-height:1.5;}

/* ════════════════ TESTIMONI ════════════════ */
.testimoni-section{padding:48px 24px;background:var(--green-pale);}
[data-theme="dark"] .testimoni-section{background:rgba(26,107,58,.1);}
.testimoni-inner{max-width:1240px;margin:0 auto;}
.testimoni-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:24px;}
@media(min-width:640px){.testimoni-grid{grid-template-columns:1fr 1fr;}}
.testimoni-card{background:var(--white);border-radius:var(--radius-lg);padding:24px;border-left:4px solid var(--green);box-shadow:var(--shadow);}
[data-theme="dark"] .testimoni-card{background:var(--bg2);}
.testimoni-teks{font-size:14px;color:var(--text-mid);line-height:1.75;font-style:italic;margin-bottom:14px;}
.testimoni-meta{display:flex;align-items:center;gap:10px;}
.testimoni-avatar{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
.testimoni-nama{font-size:13px;font-weight:700;color:var(--navy);}
.testimoni-peran{font-size:11.5px;color:var(--text-light);}

/* ════════════════ INFO KONTAK CEPAT ════════════════ */
.infobar-section{background:var(--navy);padding:20px 24px;}
.infobar-inner{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center;}
.infobar-item{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.85);font-size:13px;}
.infobar-icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.infobar-label{font-size:11px;color:rgba(255,255,255,.5);}
.infobar-val{font-size:13px;font-weight:600;color:#fff;}

/* ════════════════ WHATSAPP FLOATING ════════════════ */
#wa-float{position:fixed;bottom:84px;right:28px;background:#25D366;color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 20px rgba(37,211,102,.5);cursor:pointer;transition:all .3s;z-index:700;text-decoration:none;}
#wa-float:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(37,211,102,.7);}
#wa-float::after{content:"Hubungi Kami";position:absolute;right:60px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;}
#wa-float:hover::after{opacity:1;}

/* ════════════════ GALERI MINI BERANDA ════════════════ */
.galeri-mini-section{padding:48px 24px;background:var(--bg2);}
[data-theme="dark"] .galeri-mini-section{background:var(--bg);}
.galeri-mini-inner{max-width:1240px;margin:0 auto;}
.galeri-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px;}
@media(min-width:640px){.galeri-mini-grid{grid-template-columns:repeat(6,1fr);}}
.galeri-mini-item{border-radius:var(--radius);overflow:hidden;aspect-ratio:1;background:var(--bg2);position:relative;cursor:pointer;}
.galeri-mini-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
.galeri-mini-item:hover img{transform:scale(1.08);}
.galeri-mini-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-light);font-size:24px;}

/* ════════════════ SECTION HEADER ════════════════ */
.section-hdr{text-align:center;margin-bottom:8px;}
.section-hdr-tag{display:inline-block;background:var(--green-pale2);color:var(--green-dark);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 12px;border-radius:20px;margin-bottom:10px;}
.section-hdr-title{font-family:var(--font-serif);font-size:clamp(20px,3vw,28px);font-weight:700;color:var(--navy);}
.section-hdr-sub{font-size:14px;color:var(--text-light);margin-top:6px;}
[data-theme="dark"] .section-hdr-title{color:#e2e8f0;}

/* ════════════════ STRUKTUR ORGANISASI ════════════════ */
.org-section{padding:48px 24px;background:var(--bg);}
.org-inner{max-width:1240px;margin:0 auto;}
.org-level{margin-bottom:20px;}
.org-level-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-light);margin-bottom:10px;padding-left:4px;}
.org-grid-1{display:flex;justify-content:center;margin-bottom:8px;}
.org-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:600px;margin:0 auto 8px;}
.org-grid-3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:640px){.org-grid-3{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.org-grid-3{grid-template-columns:repeat(5,1fr);}}
.org-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;text-align:center;position:relative;overflow:hidden;transition:all .3s;}
.org-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;}
.org-card.lv1::before{background:var(--green-dark);}
.org-card.lv2::before{background:var(--green-mid);}
.org-card.lv3::before{background:var(--green-light);}
.org-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(15,34,64,.12);}
.org-card-avatar{width:48px;height:48px;border-radius:50%;background:var(--green-pale2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--green-dark);margin:0 auto 10px;}
.org-card-jabatan{font-size:12px;font-weight:700;color:var(--green-dark);margin-bottom:4px;line-height:1.3;}
.org-card-nama{font-size:12px;color:var(--text-mid);line-height:1.4;}
.org-connector{width:2px;height:20px;background:var(--border);margin:0 auto;}
/* ════════════════ RESET ════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;font-size:15px;}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.65;transition:background .3s,color .3s;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
img{display:block;max-width:100%;}
ul{list-style:none;}

/* ════════════════ TOPBAR ════════════════ */
.topbar{background:var(--navy);color:rgba(255,255,255,.85);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;max-width:1240px;margin:0 auto;padding:0 24px;height:var(--topbar-h);}
.tb-left{display:flex;gap:20px;}
.tb-item{display:flex;align-items:center;gap:6px;font-size:12px;}
.tb-right{display:flex;align-items:center;gap:12px;}
.tb-social{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);transition:background .2s;}
.tb-social:hover{background:var(--green-light);}
.tb-admin-btn{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;background:var(--green-light);color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px;transition:background .2s;}
.tb-admin-btn:hover{background:var(--green);}
.tb-hide{display:none;}
@media(min-width:640px){.tb-hide{display:flex;}}

/* Announce */
.announce-bar{background:var(--green-dark);border-top:1px solid rgba(255,255,255,.08);}
.announce-inner{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:12px;height:var(--announce-h);}
.announce-label{font-size:11px;font-weight:700;color:var(--gold);white-space:nowrap;background:rgba(200,151,42,.15);padding:2px 8px;border-radius:4px;}
.announce-scroll{flex:1;overflow:hidden;height:100%;display:flex;align-items:center;}
.announce-track{font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap;animation:scroll-announce 30s linear infinite;}
@keyframes scroll-announce{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}

/* ════════════════ NAVBAR ════════════════ */
.navbar{position:sticky;top:0;z-index:1000;background:var(--white);border-bottom:2px solid var(--green);box-shadow:var(--shadow);transition:box-shadow .3s;}
.nav-scrolled{box-shadow:0 4px 20px rgba(15,34,64,.15);}
.nav-inner{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:var(--nav-h);}
.nav-brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.nav-logo{width:50px;height:50px;object-fit:contain;border-radius:50%;}
.nav-brand-txt{display:flex;flex-direction:column;}
.nav-brand-name{font-size:14px;font-weight:800;color:var(--navy);line-height:1.2;}
.nav-brand-sub{font-size:10.5px;color:var(--text-light);}
.nav-links{display:none;align-items:center;gap:2px;}
@media(min-width:1024px){.nav-links{display:flex;}}
.nav-item{position:relative;}
.nav-btn{display:flex;align-items:center;gap:5px;padding:8px 13px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text-mid);transition:all .2s;white-space:nowrap;}
.nav-btn:hover,.nav-active{color:var(--green);background:var(--green-pale);}
.nav-ppdb{background:var(--green) !important;color:#fff !important;border-radius:20px;padding:7px 16px !important;}
.nav-ppdb:hover{background:var(--green-dark) !important;}
/* dropdown */
.nav-drop{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:var(--white);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .3s ease,transform .3s ease,visibility .3s;pointer-events:none;z-index:500;}
.nav-item.nav-open .nav-drop{opacity:1;visibility:visible;transform:translateY(0);pointer-events:all;}
.nav-drop-item{display:flex;align-items:center;gap:8px;padding:11px 16px;font-size:13px;color:var(--text-mid);cursor:pointer;transition:all .15s;}
.nav-drop-item:hover{background:var(--green-pale);color:var(--green);}
.nav-drop-item:first-child{border-radius:var(--radius) var(--radius) 0 0;}
.nav-drop-item:last-child{border-radius:0 0 var(--radius) var(--radius);}
/* hamburger */
.nav-hamburger{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;color:var(--navy);}
.nav-hamburger:hover{background:var(--green-pale);}
@media(min-width:1024px){.nav-hamburger{display:none;}}
/* mobile menu */
.nav-mobile{border-top:1px solid var(--border);background:var(--white);padding:12px 24px 20px;}
.mob-row{display:flex;align-items:center;gap:8px;padding:11px 0;font-size:14px;font-weight:600;color:var(--text);border-bottom:1px solid var(--bg2);cursor:pointer;}
.mob-row:hover{color:var(--green);}
.mob-sub-row{padding:8px 16px;font-size:13px;color:var(--text-mid);cursor:pointer;}
.mob-sub-row:hover{color:var(--green);}

/* ════════════════ PAGE HEADER ════════════════ */
.page-hdr{position:relative;background:var(--green-dark);min-height:160px;display:flex;align-items:center;background-size:cover;background-position:center;}
.page-hdr-overlay{position:absolute;inset:0;background:rgba(15,34,64,.6);}
.page-hdr-inner{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:40px 24px;}
.page-hdr-title{font-family:var(--font-serif);font-size:clamp(24px,4vw,36px);font-weight:700;color:#fff;line-height:1.2;}
.page-hdr-sub{font-size:14px;color:rgba(255,255,255,.75);margin-top:8px;}

/* ════════════════ HERO ════════════════ */
.hero{position:relative;background:var(--navy);min-height:480px;display:flex;align-items:center;background-size:cover;background-position:center;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(120deg,rgba(11,26,62,.88) 40%,rgba(11,26,62,.5));}
.hero-inner{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:80px 24px;max-width:700px;margin-left:max(24px,calc(50vw - 620px));}
.hero-badge{display:inline-block;background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:20px;}
.hero-h1{font-family:var(--font-serif);font-size:clamp(26px,4.5vw,46px);font-weight:700;color:#fff;line-height:1.2;margin-bottom:16px;}
.hero-sub{font-size:17px;color:rgba(255,255,255,.78);margin-bottom:32px;letter-spacing:1px;}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px;}
.hero-btn-primary{padding:12px 28px;border-radius:30px;background:var(--green-light);color:#fff;font-weight:700;font-size:14px;transition:background .2s;border:2px solid transparent;}
.hero-btn-primary:hover{background:var(--green);}
.hero-btn-secondary{padding:12px 28px;border-radius:30px;background:transparent;color:#fff;font-weight:700;font-size:14px;border:2px solid rgba(255,255,255,.5);transition:all .2s;}
.hero-btn-secondary:hover{background:rgba(255,255,255,.15);border-color:#fff;}

/* ════════════════ MARQUEE ════════════════ */
.marquee-wrap{background:var(--green);overflow:hidden;height:38px;display:flex;align-items:center;}
.marquee-track{display:flex;align-items:center;white-space:nowrap;animation:marquee-anim 35s linear infinite;}
.marquee-item{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.92);padding:0 8px;}
.marquee-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:middle;}
@keyframes marquee-anim{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ════════════════ NEWS SLIDER ════════════════ */
.news-slider{background:var(--navy);position:relative;}
.news-slider-inner{max-width:1240px;margin:0 auto;padding:0;position:relative;}
.ns-slide{position:relative;display:grid;grid-template-columns:1fr;min-height:280px;cursor:pointer;overflow:hidden;}
@media(min-width:768px){.ns-slide{grid-template-columns:1.1fr 1fr;min-height:340px;}}
.ns-img{position:relative;background-color:var(--navy);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.25);min-height:220px;transition:background-image .4s ease;}
.ns-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,26,62,0) 0%,rgba(11,26,62,.55) 100%);}
@media(min-width:768px){.ns-overlay{background:linear-gradient(90deg,rgba(11,26,62,.05) 0%,rgba(11,26,62,.65) 100%);}}
.ns-content{padding:28px 24px 40px;display:flex;flex-direction:column;justify-content:center;color:#fff;}
.ns-cat{display:inline-block;background:var(--green);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 12px;border-radius:20px;width:fit-content;margin-bottom:12px;}
.ns-title{font-family:var(--font-serif);font-size:clamp(20px,3vw,28px);font-weight:700;line-height:1.3;margin-bottom:10px;}
.ns-exc{font-size:13.5px;color:rgba(255,255,255,.78);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:14px;}
.ns-date{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.6);}
.ns-dots{position:absolute;bottom:14px;left:24px;display:flex;gap:7px;z-index:2;}
@media(min-width:768px){.ns-dots{left:auto;right:24px;bottom:20px;}}
.ns-dot{width:24px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);border:none;cursor:pointer;padding:0;transition:background .3s;}
.ns-dot-active{background:var(--green);}

/* ════════════════ LAYOUT ════════════════ */
.content-wrap{max-width:1240px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:1fr;gap:32px;}
@media(min-width:900px){.content-wrap{grid-template-columns:1fr 320px;}}
.main-col{min-width:0;}
.content-section{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:32px;margin-bottom:28px;}
.content-section:last-child{margin-bottom:0;}
.cs-header{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.cs-tag{display:inline-block;background:var(--green-pale2);color:var(--green-dark);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
.cs-title{font-family:var(--font-serif);font-size:22px;font-weight:700;color:var(--navy);}
.mt-32{margin-top:32px;}
.mt-24{margin-top:24px;}
.mt-20{margin-top:20px;}
.mt-16{margin-top:16px;}

/* ════════════════ SIDEBAR ════════════════ */
.sidebar{display:flex;flex-direction:column;gap:20px;}
.sb-card{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
.sb-card-head{background:var(--green);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:11px 18px;}
/* kepsek */
.sb-kepsek{display:flex;align-items:center;gap:14px;padding:16px;}
.sb-kepsek-img{width:60px;height:60px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--green-pale2);}
.sb-kepsek-avatar{width:60px;height:60px;border-radius:50%;background:var(--green-pale);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--green);flex-shrink:0;}
.sb-kepsek-nama{font-size:13px;font-weight:700;color:var(--navy);}
.sb-kepsek-jab{font-size:11.5px;color:var(--text-light);margin-top:2px;}
/* agenda */
.sb-agenda-item{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--bg);}
.sb-agenda-item:last-child{border:none;}
.sb-agenda-date{width:44px;min-width:44px;background:var(--green-pale);border-radius:8px;text-align:center;padding:6px 4px;display:flex;flex-direction:column;}
.sb-agenda-day{font-size:18px;font-weight:800;color:var(--green);line-height:1;}
.sb-agenda-mon{font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--green-mid);}
.sb-agenda-title{font-size:13px;color:var(--text);font-weight:500;line-height:1.4;}
/* sidebar news */
.sb-news-item{display:flex;gap:10px;padding:11px 18px;border-bottom:1px solid var(--bg);cursor:pointer;transition:background .15s;}
.sb-news-item:last-child{border:none;}
.sb-news-item:hover{background:var(--green-pale);}
.sb-news-thumb{width:56px;min-width:56px;height:48px;border-radius:6px;background:var(--bg2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-light);}
.sb-news-body{min-width:0;}
.sb-news-title{font-size:12.5px;font-weight:600;color:var(--navy);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sb-news-date{font-size:11px;color:var(--text-light);margin-top:3px;}
/* stats */
.sb-stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 18px;border-bottom:1px solid var(--bg);}
.sb-stat-row:last-child{border:none;}
.sb-stat-label{font-size:12.5px;color:var(--text-mid);}
.sb-stat-val{font-size:13px;font-weight:700;color:var(--green);}
/* ppdb cta */
.sb-ppdb-card{background:var(--green-dark) !important;padding:20px 18px;}
.sb-ppdb-title{font-size:16px;font-weight:800;color:#fff;margin-bottom:6px;}
.sb-ppdb-text{font-size:12.5px;color:rgba(255,255,255,.75);margin-bottom:14px;}
.sb-ppdb-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:8px;background:var(--gold);color:var(--navy);font-weight:700;font-size:13px;transition:background .2s;}
.sb-ppdb-btn:hover{background:#b08222;}

/* ════════════════ BERANDA: Sambutan mini ════════════════ */
.samb-mini{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
.samb-mini-photo{width:100px;height:100px;border-radius:50%;flex-shrink:0;overflow:hidden;border:3px solid var(--green-pale2);}
.samb-mini-body{flex:1;min-width:200px;}
.samb-mini-nama{font-size:16px;font-weight:700;color:var(--navy);}
.samb-mini-jab{font-size:12px;color:var(--green);font-weight:600;margin-bottom:10px;}
.samb-mini-text{font-size:14px;color:var(--text-mid);line-height:1.75;margin-bottom:12px;}
.link-btn{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:13px;font-weight:700;padding:6px 0;border-bottom:2px solid transparent;transition:border .2s;}
.link-btn:hover{border-bottom-color:var(--green);}

/* ════════════════ NEWS CARDS ════════════════ */
.news-list{display:flex;flex-direction:column;gap:0;}
.news-card{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--bg2);cursor:pointer;transition:background .15s;}
.news-card:last-child{border:none;padding-bottom:0;}
.news-card:hover{background:var(--green-pale);margin:0 -32px;padding-left:32px;padding-right:32px;}
.news-card-thumb{width:140px;min-width:140px;height:110px;border-radius:var(--radius);background:var(--bg2);overflow:hidden;position:relative;flex-shrink:0;}
.news-card-thumb img{width:100%;height:100%;object-fit:contain !important;object-position:center;background:var(--bg2);}
.news-card-thumb-ph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-light);}
.news-card-cat{position:absolute;bottom:6px;left:6px;background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;}
.news-card-body{flex:1;min-width:0;}
.news-card-date{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-light);margin-bottom:6px;}
.news-card-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px;line-height:1.4;}
.news-card-exc{font-size:13px;color:var(--text-mid);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.news-card-more{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--green);font-weight:600;margin-top:8px;}

/* ════════════════ BERITA DETAIL ════════════════ */
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green);background:none;border:none;cursor:pointer;margin-bottom:14px;padding:0;}
.back-link:hover{text-decoration:underline;}
.berita-detail-img{width:100%;border-radius:10px;object-fit:cover;max-height:380px;}
.berita-detail-title{font-size:24px;font-weight:800;color:var(--navy);margin:10px 0 14px;line-height:1.35;}
.berita-detail-body{font-size:14.5px;color:var(--text-mid);line-height:1.9;white-space:pre-line;}
.berita-detail-other-title{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:14px;}
.share-row{display:flex;align-items:center;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--border);}
.berita-link-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:8px;background:var(--green-pale);color:var(--green-dark);text-decoration:none;margin-top:14px;transition:background .2s;}
.berita-link-btn:hover{background:var(--green-mid);color:#fff;}
.share-label{font-size:13px;font-weight:600;color:var(--text-mid);}
.share-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:8px;color:#fff;text-decoration:none;transition:opacity .2s;}
.share-btn:hover{opacity:.85;}
.share-wa{background:#25D366;}
.share-fb{background:#1877F2;}

/* ════════════════ DOWNLOAD PAGE ════════════════ */
.download-list{display:flex;flex-direction:column;gap:10px;}
.download-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:10px;transition:box-shadow .2s;}
.download-item:hover{box-shadow:var(--shadow);}
.download-icon{flex-shrink:0;width:42px;height:42px;border-radius:8px;background:var(--green-pale);color:var(--green);display:flex;align-items:center;justify-content:center;}
.download-info{flex:1;}
.download-title{font-size:14px;font-weight:700;color:var(--navy);}
.download-cat{font-size:12px;color:var(--text-light);margin-top:2px;}
.download-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:8px;background:var(--green);color:#fff;text-decoration:none;white-space:nowrap;transition:background .2s;}
.download-btn:hover{background:var(--green-dark);}
.download-btn-disabled{background:var(--bg);color:var(--text-light);cursor:default;}
.empty-note{font-size:13px;color:var(--text-light);text-align:center;padding:30px 0;}

/* ════════════════ AGENDA FULL ════════════════ */
.agenda-full-list{display:flex;flex-direction:column;gap:4px;}
.agenda-full-item{display:flex;gap:14px;padding:14px 6px;border-bottom:1px solid var(--bg);}
.agenda-full-item:last-child{border:none;}
.agenda-full-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:3px;}
.agenda-full-desc{font-size:13px;color:var(--text-mid);line-height:1.6;}

/* ════════════════ SAMBUTAN FULL ════════════════ */
.samb-full{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:28px;padding:24px;background:var(--green-pale);border-radius:var(--radius);}
@media(min-width:640px){.samb-full{flex-direction:row;}}
.samb-full-photo{width:130px;height:130px;min-width:130px;border-radius:50%;overflow:hidden;border:4px solid var(--green-pale2);}
.samb-full-info{text-align:center;}
@media(min-width:640px){.samb-full-info{text-align:left;}}
.samb-full-nama{font-size:18px;font-weight:800;color:var(--navy);}
.samb-full-jab{font-size:13px;color:var(--green);font-weight:700;}
.samb-full-nip{font-size:12px;color:var(--text-light);margin-top:4px;}
.samb-content p{font-size:14.5px;color:var(--text-mid);line-height:1.85;margin-bottom:16px;}

/* ════════════════ VISI MISI ════════════════ */
.visi-box{background:var(--green-pale);border-left:4px solid var(--green);border-radius:0 var(--radius) var(--radius) 0;padding:20px 22px;font-family:var(--font-serif);font-size:15px;color:var(--green-dark);font-style:italic;line-height:1.8;}
.misi-list{display:flex;flex-direction:column;gap:12px;}
.misi-list li{display:flex;align-items:flex-start;gap:14px;font-size:14px;color:var(--text-mid);line-height:1.7;}
.misi-no{width:28px;min-width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.motto-box{background:var(--navy);color:#fff;text-align:center;padding:24px;border-radius:var(--radius-lg);font-family:var(--font-serif);font-size:22px;font-weight:700;letter-spacing:2px;}

/* ════════════════ GURU ════════════════ */
.guru-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;}
.guru-card{background:var(--bg);border-radius:var(--radius);padding:20px 16px;text-align:center;transition:box-shadow .2s;}
.guru-card:hover{box-shadow:var(--shadow-lg);}
.guru-photo{width:80px;height:80px;border-radius:50%;overflow:hidden;margin:0 auto 12px;border:3px solid var(--green-pale2);}
.guru-initial{width:100%;height:100%;background:var(--green-pale);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--green);}
.guru-nama{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px;line-height:1.3;}
.guru-jabatan{font-size:11.5px;color:var(--green);font-weight:600;}

/* ════════════════ SEJARAH / TIMELINE ════════════════ */
.sejarah-foto-wrap img{border-radius:var(--radius-lg);}
.timeline{display:flex;flex-direction:column;gap:0;position:relative;}
.timeline::before{content:"";position:absolute;left:54px;top:0;bottom:0;width:2px;background:var(--green-pale2);}
.tl-item{display:flex;align-items:flex-start;gap:20px;padding:0 0 32px;}
.tl-year{width:54px;min-width:54px;text-align:right;font-size:13px;font-weight:800;color:var(--green);padding-top:4px;}
.tl-dot{width:14px;min-width:14px;height:14px;border-radius:50%;background:var(--green);border:3px solid var(--white);margin-top:4px;z-index:1;position:relative;}
.tl-body{flex:1;padding-top:2px;}
.tl-judul{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px;}
.tl-desc{font-size:13.5px;color:var(--text-mid);line-height:1.7;}

/* ════════════════ STRUKTUR ════════════════ */
.struktur-tree{text-align:center;padding:8px;}
.st-top{display:inline-block;background:var(--green);color:#fff;padding:16px 32px;border-radius:var(--radius);margin-bottom:4px;}
.st-nama{font-size:14px;font-weight:700;}
.st-jab{font-size:12px;opacity:.85;margin-top:3px;}
.st-line{width:2px;height:32px;background:var(--green-pale2);margin:0 auto;}
.st-mid{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
.st-card{background:var(--green-pale);border:2px solid var(--green-pale2);padding:14px 22px;border-radius:var(--radius);text-align:center;}
.st-card .st-nama{color:var(--navy);}
.st-card .st-jab{color:var(--green);}

/* ════════════════ KURIKULUM ════════════════ */
.kuri-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
.kuri-card{background:var(--green-pale);border-radius:var(--radius);padding:20px 16px;display:flex;flex-direction:column;gap:8px;}
.kuri-no{font-size:24px;font-weight:800;color:var(--green-pale2);}
.kuri-txt{font-size:13.5px;font-weight:600;color:var(--green-dark);}

/* ════════════════ EKSKUL ════════════════ */
.ekskul-list{display:flex;flex-direction:column;gap:0;}
.eks-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--bg2);}
.eks-row:last-child{border:none;}
.eks-icon{font-size:24px;width:40px;text-align:center;}
.eks-nama{font-size:15px;font-weight:700;color:var(--navy);}
.eks-jadwal{font-size:12.5px;color:var(--text-light);}

/* ════════════════ KALENDER ════════════════ */
.kal-table{width:100%;border-collapse:collapse;}
.kal-table th{background:var(--green);color:#fff;padding:11px 16px;text-align:left;font-size:13px;}
.kal-table td{padding:11px 16px;font-size:13.5px;border-bottom:1px solid var(--bg2);}
.kal-table tr:nth-child(even) td{background:var(--green-pale);}

/* ════════════════ PRESTASI ════════════════ */
.prestasi-list{display:flex;flex-direction:column;gap:0;}

<div id="root"></div>
<script>
const {
  useState,
  useEffect,
  useRef
} = React;

/* ──── STORAGE ──── */
const SUPABASE_URL = "https://mqbkvfrryfkxnbfgixyg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xYmt2ZnJyeWZreG5iZmdpeHlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMTI2OTgsImV4cCI6MjA5Njg4ODY5OH0.Hx8RDPSgX4x_BC8ZeYS7_gAu3tGtVnmAXGA8KOiz9yo";
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
}) : null;
if (!sb) console.error("Supabase JS SDK gagal dimuat (CDN diblokir?) — data hanya pakai cache lokal.");

// Supabase v2 sometimes tries to broadcast auth state via BroadcastChannel/postMessage,
// which can throw "DataCloneError: ... Headers object could not be cloned" as a global
// (unhandled) error — not a promise rejection — so it bypasses normal try/catch.
// Silence just this specific noise so it doesn't break the load/save flow.
window.addEventListener("error", (e) => {
  if (e && e.message && e.message.indexOf("DataCloneError") !== -1) {
    e.preventDefault();
    console.warn("Diabaikan: BroadcastChannel DataCloneError (tidak mempengaruhi data).");
  }
});
window.addEventListener("unhandledrejection", (e) => {
  const msg = e && e.reason && (e.reason.message || String(e.reason));
  if (msg && msg.indexOf("DataCloneError") !== -1) {
    e.preventDefault();
    console.warn("Diabaikan: BroadcastChannel DataCloneError (tidak mempengaruhi data).");
  }
});
const DATA_KEY = "smpn2b_data_v3";
const FOTO_KEY = "smpn2b_foto";

// ──── Helper: extract safe string from Supabase errors (avoids DataCloneError
// from Headers objects propagating through BroadcastChannel in Supabase v2) ────
const safeMsg = (e) => {
  try {
    if (!e) return "Unknown error";
    if (typeof e === "string") return e;
    // Prefer plain string properties — never touch e.headers or Response objects
    if (typeof e.message === "string" && e.message) return e.message;
    if (typeof e.code === "string" && e.code) return e.code;
    if (typeof e.error_description === "string") return e.error_description;
    if (typeof e.details === "string") return e.details;
    if (typeof e.hint === "string") return e.hint;
    // Fallback: list own enumerable keys (safe, no cloning)
    const keys = Object.keys(e).filter(k => typeof e[k] !== "object");
    return keys.length ? keys.join(",") : "Supabase error";
  } catch (_) { return "Supabase error"; }
};

// Wrap a Supabase promise so any rejected value is converted to a plain Error
// BEFORE it can propagate through BroadcastChannel and trigger DataCloneError
const sbWrap = (promise) => {
  if (!promise || typeof promise.then !== "function") {
    return Promise.reject(new Error("Supabase client unavailable (CDN blocked?)"));
  }
  return Promise.resolve(promise).catch(e => { throw new Error(safeMsg(e)); });
};

// Load main "sekolah" data from Supabase, fallback to localStorage cache
const loadDataRemote = async (fb) => {
  try {
    const { data: rows, error } = await sbWrap(
      sb && sb.from("sekolah").select("data").eq("id", "main").limit(1)
    );
    if (error) throw new Error(safeMsg(error));
    const data = rows && rows[0];
    if (data && data.data) {
      const merged = deepMerge(fb, data.data);
      localStorage.setItem(DATA_KEY, JSON.stringify(merged));
      return merged;
    }
    // No row yet - seed it with default/fallback data
    const seed = loadData(fb);
    await saveDataRemote(seed);
    return seed;
  } catch (e) {
    console.warn("Supabase load failed, using local cache:", safeMsg(e));
    return loadData(fb);
  }
};

// Save main "sekolah" data to Supabase (and keep local cache in sync)
const saveDataRemote = async (v) => {
  saveData(v); // local cache for instant UI + offline fallback
  try {
    const { error } = await sbWrap(
      sb && sb.from("sekolah").upsert({ id: "main", data: v })
    );
    if (error) throw new Error(safeMsg(error));
    return true;
  } catch (e) {
    console.warn("Supabase save failed, data only saved locally:", safeMsg(e));
    return false;
  }
};

// ──── PHOTO STORAGE (Supabase Storage bucket "media") ────
// Upload a base64/dataURL image to Supabase Storage, return public URL
const uploadFotoRemote = async (path, dataUrl) => {
  try {
    // Convert dataURL to Blob
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const ext = (blob.type.split("/")[1] || "jpg").split("+")[0];
    const filePath = `${path}.${ext}`;
    const { error } = await sbWrap(
      sb && sb.storage.from("media").upload(filePath, blob, { upsert: true, contentType: blob.type })
    );
    if (error) throw new Error(safeMsg(error));
    if (!sb) throw new Error("Supabase client unavailable");
    const { data } = sb.storage.from("media").getPublicUrl(filePath);
    // cache-bust so updated images show immediately everywhere
    return data.publicUrl + "?v=" + Date.now();
  } catch (e) {
    console.warn("Supabase storage upload failed:", safeMsg(e));
    return null;
  }
};

// Load the "foto" map (URLs) from Supabase "sekolah" row's foto column
const loadFotoRemote = async () => {
  try {
    const { data: rows, error } = await sbWrap(
      sb && sb.from("sekolah").select("foto").eq("id", "main").limit(1)
    );
    if (error) throw new Error(safeMsg(error));
    const data = rows && rows[0];
    if (data && data.foto) {
      saveFoto(data.foto);
      return data.foto;
    }
    return loadFoto();
  } catch (e) {
    console.warn("Supabase foto load failed, using local cache:", safeMsg(e));
    return loadFoto();
  }
};

// Save the "foto" map (URLs) to Supabase "sekolah" row's foto column
const saveFotoRemote = async (v) => {
  saveFoto(v);
  try {
    const { error } = await sbWrap(
      sb && sb.from("sekolah").upsert({ id: "main", foto: v })
    );
    if (error) throw new Error(safeMsg(error));
    return true;
  } catch (e) {
    console.warn("Supabase foto save failed, only saved locally:", safeMsg(e));
    return false;

const deepMerge = (defaults, loaded) => {
  if (!loaded || typeof loaded !== "object") return defaults;
  const result = { ...defaults };
  for (const key of Object.keys(defaults)) {
    if (loaded[key] !== undefined) {
      if (typeof defaults[key] === "object" && !Array.isArray(defaults[key]) && defaults[key] !== null) {
        result[key] = deepMerge(defaults[key], loaded[key]);
      } else {
        result[key] = loaded[key];
      }
    }
  }
  // Tambahkan field dari loaded yang tidak ada di defaults (misal data tambahan user)
  for (const key of Object.keys(loaded)) {
    if (!(key in defaults)) result[key] = loaded[key];
  }
  return result;
};

(function initLoader() {
  // Apply saved theme immediately to avoid flash
  const saved = localStorage.getItem("smpn2_theme");
  if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");

  window.addEventListener("load", () => {
    const loader = document.getElementById("page-loader");
    if (!loader) return;
    setTimeout(() => {
      loader.classList.add("fade-out");
      setTimeout(() => loader.remove(), 600);
    }, 900);
  });
})();

/* ══════════════════════════════════════════
   SCROLL REVEAL — IntersectionObserver
══════════════════════════════════════════ */
(function initScrollReveal() {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("revealed");
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });

  const observe = () => {
    document.querySelectorAll(".reveal,.reveal-left,.reveal-scale").forEach(el => {
      if (!el.classList.contains("revealed")) io.observe(el);
    });
  };

  // Run on initial load and watch for React re-renders
  observe();
  const mo = new MutationObserver(observe);
  mo.observe(document.body, { childList: true, subtree: true });
})();

/* ══════════════════════════════════════════
   CARD LIFT — add class to cards
══════════════════════════════════════════ */
(function addCardLift() {
  const sel = ".content-section,.sb-card,.news-card,.galeri-item,.af-card";
  const apply = () => {
    document.querySelectorAll(sel).forEach(el => el.classList.add("card-lift"));
  };
  apply();
  const mo = new MutationObserver(apply);
  mo.observe(document.body, { childList: true, subtree: true });
})();
